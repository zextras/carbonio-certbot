# Carbonio Certbot directories
# See tmpfiles.d(5) for format

d /opt/zextras/.well-known/acme-challenge - zextras zextras
d /opt/zextras/common/certbot/etc/letsencrypt 0750 zextras zextras
d /var/lib/carbonio-letsencrypt - zextras zextras
d /var/log/carbonio/letsencrypt 0700 zextras zextras

Z /opt/zextras/.well-known - zextras zextras

# Ownership only (mode '-'): certbot manages its own file modes (keys 0600,
# archive/ 0700). Forcing a mode here would rewrite them on every boot.
Z /opt/zextras/common/certbot/etc/letsencrypt - zextras zextras
Z /var/lib/carbonio-letsencrypt - zextras zextras
Z /var/log/carbonio/letsencrypt - zextras zextras
